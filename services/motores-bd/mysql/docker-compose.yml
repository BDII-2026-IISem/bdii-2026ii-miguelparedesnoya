services:
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    restart: unless-stopped
    env_file: [.env]
    ports: ["3306:3306"]
    volumes: ["../../../data/mysql:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --bind-address=0.0.0.0
    networks: [ia-lab-network]

networks:
  ia-lab-network:
    external: true
